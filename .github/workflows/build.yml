name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    name: Build DiskNuke.app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Build (Release, ad-hoc signed)
        run: |
          xcodebuild -project DiskNuke.xcodeproj -scheme DiskNuke \
            -configuration Release -derivedDataPath build \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Package
        run: |
          cd build/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent DiskNuke.app "$GITHUB_WORKSPACE/DiskNuke.zip"
          shasum -a 256 "$GITHUB_WORKSPACE/DiskNuke.zip" | tee "$GITHUB_WORKSPACE/DiskNuke.zip.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiskNuke-${{ github.sha }}
          path: |
            DiskNuke.zip
            DiskNuke.zip.sha256

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            DiskNuke.zip
            DiskNuke.zip.sha256
          generate_release_notes: true
          body: |
            Unsigned/unnotarized build (ad-hoc signature). After unzipping, right-click DiskNuke.app and choose **Open**, or run:
            `xattr -dr com.apple.quarantine DiskNuke.app`
